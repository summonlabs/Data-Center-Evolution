name: ci

# Cross-platform continuous integration for the Data Center Evolution library.
#
# Conventions that hold for the whole file:
#   * Every command is one a reader can run locally, exactly as written.
#   * No step writes to the repository, publishes artifacts or pushes anything.
#   * No timeouts anywhere: a hanging build or test is a defect to diagnose,
#     never something to abort and report as passing.
#   * Build caching is deliberately omitted.
#   * Ninja is used on every platform, including Windows, so one set of commands
#     covers all three compilers and no job depends on a particular Visual
#     Studio generator name existing in the runner image.
#   * The final `gate` job is the single required status check for branch
#     protection; it fails whenever any job above it did not succeed.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Windows / MSVC, both configurations.
  #
  # The image's Visual Studio is discovered rather than assumed: a runner may
  # ship a release newer than any generator name this CMake knows, and the
  # failure that produces says nothing about which toolset is installed.
  # ---------------------------------------------------------------------------
  windows-msvc:
    name: windows-msvc (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Locate the Visual Studio C++ toolset and export its environment
        shell: pwsh
        run: |
          # vswhere ships with the Visual Studio installer and reports the newest
          # installation that actually provides the x64 C++ toolset, so nothing here
          # depends on a generator name this CMake release happens to know.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'vswhere.exe was not found, so this image has no Visual Studio installer'
          }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw 'no Visual Studio installation provides the x64 C++ toolset'
          }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) {
            throw "vcvars64.bat was not found at $vcvars"
          }
          Write-Host "Visual Studio C++ toolset: $installation"
          $quoted = '"' + $vcvars + '"'
          $lines = cmd /c "$quoted >nul 2>&1 && set"
          if ($LASTEXITCODE -ne 0) {
            throw "vcvars64.bat failed with exit code $LASTEXITCODE"
          }
          # ASCII keeps the file free of a byte-order mark, which would corrupt
          # the first variable name the runner reads back.
          $written = 0
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
              $written = $written + 1
            }
          }
          if ($written -lt 10) {
            throw "only $written environment variables were exported, so vcvars64.bat did not run"
          }
          Write-Host "$written variables exported to every later step"

      - name: Configure (Ninja, MSVC, ${{ matrix.build_type }})
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DDCE_BUILD_TESTS=ON -DDCE_BUILD_TOOLS=ON -DDCE_BUILD_EXAMPLES=ON -DDCE_BUILD_BENCHMARKS=ON -DDCE_WARNINGS_AS_ERRORS=ON
          if errorlevel 1 exit /b 1

      - name: Build (${{ matrix.build_type }})
        shell: cmd
        run: |
          cmake --build build --parallel
          if errorlevel 1 exit /b 1

      - name: Test (${{ matrix.build_type }})
        shell: cmd
        run: |
          ctest --test-dir build -V
          if errorlevel 1 exit /b 1

  # ---------------------------------------------------------------------------
  # Linux / gcc.
  # ---------------------------------------------------------------------------
  ubuntu-gcc:
    name: ubuntu-gcc (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Ninja, gcc, ${{ matrix.build_type }})
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DDCE_BUILD_TESTS=ON
          -DDCE_BUILD_TOOLS=ON
          -DDCE_BUILD_EXAMPLES=ON
          -DDCE_BUILD_BENCHMARKS=ON
          -DDCE_WARNINGS_AS_ERRORS=ON

      - name: Build (${{ matrix.build_type }})
        run: cmake --build build --parallel

      - name: Test (${{ matrix.build_type }})
        run: ctest --test-dir build -V

  # ---------------------------------------------------------------------------
  # Linux / clang.
  # ---------------------------------------------------------------------------
  ubuntu-clang:
    name: ubuntu-clang (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Ninja, clang, ${{ matrix.build_type }})
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DDCE_BUILD_TESTS=ON
          -DDCE_BUILD_TOOLS=ON
          -DDCE_BUILD_EXAMPLES=ON
          -DDCE_BUILD_BENCHMARKS=ON
          -DDCE_WARNINGS_AS_ERRORS=ON

      - name: Build (${{ matrix.build_type }})
        run: cmake --build build --parallel

      - name: Test (${{ matrix.build_type }})
        run: ctest --test-dir build -V

  # ---------------------------------------------------------------------------
  # Linux / Clang with AddressSanitizer and UndefinedBehaviorSanitizer.
  # There are no suppression files: the first sanitizer report fails the job.
  # ---------------------------------------------------------------------------
  ubuntu-sanitizers:
    name: ubuntu-sanitizers (clang, Ninja, Debug, ASan+UBSan)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Ninja, clang, Debug, ASan + UBSan)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DDCE_BUILD_TESTS=ON
          -DDCE_BUILD_TOOLS=ON
          -DDCE_BUILD_EXAMPLES=ON
          -DDCE_BUILD_BENCHMARKS=ON
          -DDCE_WARNINGS_AS_ERRORS=ON
          -DDCE_ENABLE_ASAN=ON
          -DDCE_ENABLE_UBSAN=ON

      - name: Build (Debug, ASan + UBSan)
        run: cmake --build build --parallel

      - name: Test (Debug, ASan + UBSan)
        run: ctest --test-dir build -V

  # ---------------------------------------------------------------------------
  # Install the library and consume the installed package from the standalone
  # project at examples/downstream-consumer. The consumer is configured from
  # the runner temp directory with its own -S and -B and is never added to the
  # main build as a subdirectory.
  #
  # bash is requested explicitly on both images (Git Bash ships with
  # windows-latest) so one set of commands covers both toolchains; on Windows
  # the MSVC environment is exported to every later step first.
  # ---------------------------------------------------------------------------
  package-downstream:
    name: package-downstream (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu-gcc
            configure_flags: -DCMAKE_CXX_COMPILER=g++
            consumer_exe: downstream_consumer
          - os: windows-latest
            label: windows-msvc
            configure_flags: ""
            consumer_exe: downstream_consumer.exe
    steps:
      - uses: actions/checkout@v4

      - name: Locate the Visual Studio C++ toolset and export its environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # vswhere ships with the Visual Studio installer and reports the newest
          # installation that actually provides the x64 C++ toolset, so nothing here
          # depends on a generator name this CMake release happens to know.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'vswhere.exe was not found, so this image has no Visual Studio installer'
          }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw 'no Visual Studio installation provides the x64 C++ toolset'
          }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) {
            throw "vcvars64.bat was not found at $vcvars"
          }
          Write-Host "Visual Studio C++ toolset: $installation"
          $quoted = '"' + $vcvars + '"'
          $lines = cmd /c "$quoted >nul 2>&1 && set"
          if ($LASTEXITCODE -ne 0) {
            throw "vcvars64.bat failed with exit code $LASTEXITCODE"
          }
          # ASCII keeps the file free of a byte-order mark, which would corrupt
          # the first variable name the runner reads back.
          $written = 0
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
              $written = $written + 1
            }
          }
          if ($written -lt 10) {
            throw "only $written environment variables were exported, so vcvars64.bat did not run"
          }
          Write-Host "$written variables exported to every later step"

      - name: Configure the library (Release)
        shell: bash
        run: |
          set -euo pipefail
          # Only the library is packaged here; the consumer is a separate project.
          cmake -S . -B "$RUNNER_TEMP/dce-library-build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.configure_flags }} \
            -DDCE_BUILD_TESTS=OFF \
            -DDCE_BUILD_TOOLS=OFF \
            -DDCE_BUILD_EXAMPLES=OFF \
            -DDCE_BUILD_BENCHMARKS=OFF \
            -DDCE_WARNINGS_AS_ERRORS=ON

      - name: Build the library (Release)
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/dce-library-build" --parallel

      - name: Install the library into the prefix
        shell: bash
        run: |
          set -euo pipefail
          cmake --install "$RUNNER_TEMP/dce-library-build" --prefix "$RUNNER_TEMP/dce-prefix"

      - name: Configure the downstream consumer against the prefix
        shell: bash
        run: |
          set -euo pipefail
          # Configured from the runner temp directory, never from inside the
          # repository, so nothing can be picked up from the library build tree.
          cd "$RUNNER_TEMP"
          # Verbose build output is what makes the link line available below.
          cmake -S "$GITHUB_WORKSPACE/examples/downstream-consumer" \
            -B "$RUNNER_TEMP/downstream-consumer-build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.configure_flags }} \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/dce-prefix" \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build the downstream consumer
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/downstream-consumer-build" --verbose 2>&1 \
            | tee "$RUNNER_TEMP/downstream-consumer-link.log"

      - name: Run the downstream consumer
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/downstream-consumer-build/${{ matrix.consumer_exe }}"
          echo "running $consumer"
          "$consumer"

      - name: Assert the consumer linked the installed library
        shell: bash
        run: |
          set -euo pipefail
          # MSVC tooling prints backslashes; every comparison below uses one
          # separator style.
          prefix="$(printf '%s' "$RUNNER_TEMP/dce-prefix" | tr '\\' '/')"
          library_build="$(printf '%s' "$RUNNER_TEMP/dce-library-build" | tr '\\' '/')"
          consumer_build="$(printf '%s' "$RUNNER_TEMP/downstream-consumer-build" | tr '\\' '/')"
          evidence="$(printf '%s' "$RUNNER_TEMP/downstream-consumer-link.log.normalized" | tr '\\' '/')"

          installed_library="$(find "$prefix" -type f \( -name 'libdce.a' -o -name 'dce.lib' \) -print -quit)"
          if [ -z "$installed_library" ]; then
            echo "::error::no installed dce library found under $prefix"
            exit 1
          fi

          # The verbose build log records the link line; the generated build
          # system records the same inputs, which keeps this check independent
          # of how much verbosity a generator supports.
          {
            tr '\\' '/' < "$RUNNER_TEMP/downstream-consumer-link.log"
            while IFS= read -r generated; do
              tr '\\' '/' < "$generated"
            done < <(find "$consumer_build" -type f -name 'build.ninja')
          } > "$evidence"

          if grep -F -q "$library_build" "$evidence"; then
            echo "::error::downstream_consumer referenced the library build tree: $library_build"
            exit 1
          fi
          if ! grep -F -q "$installed_library" "$evidence"; then
            echo "::error::downstream_consumer did not link the installed library: $installed_library"
            exit 1
          fi
          echo "downstream_consumer linked the installed library: $installed_library"

  # ---------------------------------------------------------------------------
  # Single required status check for branch protection. It runs even when an
  # upstream job failed and fails unless every one of them succeeded.
  # ---------------------------------------------------------------------------
  gate:
    name: gate
    needs:
      - windows-msvc
      - ubuntu-gcc
      - ubuntu-clang
      - ubuntu-sanitizers
      - package-downstream
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report the result of every required job
        run: echo '${{ toJSON(needs) }}'

      - name: Fail when any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::At least one required job did not succeed."
          exit 1

      - name: Confirm every required job succeeded
        run: echo "All required jobs succeeded."
